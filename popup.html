<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Тестовый пациент</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="registration.css"></head>
<body>
<header><span class="brand">ОБЛТЕХ <span>/ DEV TOOLS</span></span></header>
<main><h1>Тестовый пациент</h1><p class="intro">Новая карточка для проверки регистрации</p>
<label>Режим генерации<select id="mode"><option value="standard">Стандартный</option><option value="elastic">elastic_new</option></select></label>
<div class="controls"><label>Пол<select id="sex"><option value="random">Случайный</option><option value="male">Мужской</option><option value="female">Женский</option></select></label><label>Полных лет<input id="age" type="number" min="14" max="100" placeholder="Случайно: 18–80"></label></div>
<button id="generate" class="primary">Сгенерировать пациента</button>
<details id="hospitalization">
<summary>Госпитализация</summary>
<p id="hospitalizationPatient"></p>
  <form id="registrationForm">
    <fieldset id="configuration" disabled>
      <legend>Подключение и пациент</legend>
      <div class="controls">
        <label>Контур<select id="environment" required><option value="">Выберите контур</option></select></label>
        <label>Process ID готового черновика<input id="processId" type="text" placeholder="Для регистрации существующего процесса"></label>
      </div>
      <section id="preparation">
        <label>Этапы подготовки<select id="workflow">
          <option value="registries">Инициализация → ЕРЗЛ → ЕРП → черновик</option>
          <option value="synchronize">Инициализация → синхронизация → черновик</option>
        </select></label>
      </section>
    </fieldset>
    <fieldset id="caseDetails" disabled>
      <legend>Реквизиты для госпитализации</legend>
      <details id="employeeSettings"><summary>Настроить сотрудника и отделение</summary>
        <div id="caseFields" class="controls"></div>
        <button id="saveEmployee" type="button">Сохранить для контура</button>
      </details>
    </fieldset>
    <button id="submitRegistration" type="submit" class="primary" disabled>Госпитализировать</button>
  </form>
  <p id="hospitalizationStatus" role="status" aria-live="polite"></p>
  <details id="trace" hidden>
    <summary>Ответы сервиса</summary>
    <div id="steps"></div>
  </details>
</details>
<dialog id="confirmHospitalization">
  <p id="confirmationTarget"></p>
  <form method="dialog">
    <button value="cancel" autofocus>Отмена</button>
    <button value="confirm">Подтвердить</button>
  </form>
</dialog>
<div class="verification"><label><input type="checkbox" disabled> Сверенный</label><small>Нет подключения к ЕРЗЛ и ЕРП. Проверяются только контрольные цифры СНИЛС и ОМС.</small></div>
<div class="card-heading"><h2>Данные пациента</h2><button id="copyAll" class="text-button">Копировать всё</button></div>
<div id="fields"></div>
<p id="status" role="status" aria-live="polite"></p>
</main><script src="core.js"></script><script src="registration.js"></script><script src="hospitalization.js"></script><script src="popup.js"></script></body></html>
