<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация пациента</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="registration.css">
</head>
<body class="registration-page">
<header><span class="brand">ОБЛТЕХ <span>/ DEV TOOLS</span></span></header>
<main>
  <h1>Регистрация стационарного случая</h1>
  <form id="registrationForm">
    <fieldset id="configuration" disabled>
      <legend>Подключение и пациент</legend>
      <div class="controls">
        <label>Контур<select id="environment" required><option value="">Выберите контур</option></select></label>
        <label>Process ID готового черновика<input id="processId" type="text" placeholder="Для регистрации существующего процесса"></label>
      </div>
      <section id="preparation">
        <label>Этапы подготовки<select id="workflow">
          <option value="registries">Инициализация → ЕРЗЛ → ЕРП → черновик</option>
          <option value="synchronize">Инициализация → синхронизация → черновик</option>
        </select></label>
        <details>
          <summary id="patientName">Карточка пациента</summary>
          <pre id="patientData"></pre>
        </details>
      </section>
    </fieldset>
    <fieldset id="caseDetails" disabled>
      <legend>Данные случая</legend>
      <div id="caseFields" class="controls"></div>
    </fieldset>
    <button id="submitRegistration" type="submit" class="primary" disabled>Зарегистрировать случай</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <details id="trace" hidden>
    <summary>Ответы сервиса</summary>
    <div id="steps"></div>
  </details>
</main>
<script src="core.js"></script>
<script src="registration.js"></script>
<script src="registration-page.js"></script>
</body>
</html>
